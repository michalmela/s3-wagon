name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign without deploying"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Publish to Clojars
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.8.3
          cache: true

      # A release that does not pass its own tests is not a release.
      - name: Verify
        run: mise run verify

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match project version $version" >&2
            exit 1
          fi

      - name: Import the signing key
        if: ${{ !inputs.dry_run }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B --no-transfer-progress -P release \
            -DskipTests -Dspotbugs.skip=true \
            --settings .github/maven-settings.xml deploy

      - name: Attach artifacts to the run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: |
            target/*.jar
            target/*.asc
            target/bom.json
          if-no-files-found: warn
