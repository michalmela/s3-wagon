name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs rather than tags: a tag can be moved, and
# an action runs with access to this build. The comment records the version.
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The JDK and Maven versions come from mise.toml, so CI and local
      # builds run on exactly the same toolchain.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.8.3
          cache: true

      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # These workflows were only ever linted by hand before.
      - name: Lint
        run: mise run lint

      # Includes the MinIO integration tests; the runner provides Docker.
      - name: Verify
        run: mise run verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: target/site/jacoco/
          if-no-files-found: ignore

  runtime:
    name: Runtime on Java ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The artifact ships Java 8 bytecode, so it has to load and work on
          # every JDK someone might be running Maven or Leiningen on.
          - { label: "8", java: "zulu-8.96.0.19" }
          - { label: "11", java: "zulu-11.90.19.0" }
          - { label: "17", java: "zulu-17.68.17.0" }
          - { label: "21", java: "zulu-21.52.15.0" }
          - { label: "25", java: "zulu-25.36.15.0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.8.3
          cache: true

      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run the wagon on Java ${{ matrix.label }}
        run: mise run verify:runtime --java ${{ matrix.java }}

  maven:
    name: Deploy and resolve on Maven ${{ matrix.maven }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        maven: ["3.9.16", "4.0.0-rc-6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.8.3
          cache: true

      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # A real 'mvn deploy' through the wagon into MinIO, then a resolve back.
      - name: End-to-end through Maven ${{ matrix.maven }}
        run: mise run verify:maven --maven ${{ matrix.maven }}
