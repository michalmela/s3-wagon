# The tests get a real SLF4J binding so nothing warns about a missing one, but the
# AWS SDK and Testcontainers are chatty at info and a green build should be quiet.
# Raise this to debug (or set -Dorg.slf4j.simpleLogger.defaultLogLevel=debug) when
# something needs looking at.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
